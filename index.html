<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#075f4f" />
    <title>GXO QHSE Forms</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header class="app-head">
      <button class="icon-btn" id="backBtn" hidden aria-label="Back">‹</button>
      <div class="brand-heading">
        <span class="gxo-wordmark" aria-label="GXO">GXO</span>
        <div>
          <span class="kicker">QHSE</span>
          <h1 id="pageTitle">Digital inspections</h1>
        </div>
      </div>
      <button class="avatar" id="recordsBtn" aria-label="Records">
        <span>☰</span>
      </button>
    </header>
    <main>
      <section id="home" class="view">
        <div class="welcome">
          <h2>Choose a Form</h2>
          <p>Fast forms designed for phones and tablets.</p>
        </div>
        <div class="form-grid">
          <button class="form-tile" data-start="meters">
            <span class="tile-icon">&#128202;</span
            ><span
              ><b>Meter readings</b
              ><small>Gas, water and electricity</small></span
            ><i>›</i></button
          ><button class="form-tile" data-start="rack">
            <span class="tile-icon">&#128230;</span
            ><span
              ><b>Racking inspection</b
              ><small>Defects and risk ratings</small></span
            ><i>›</i>
          </button>
          <button class="form-tile" data-start="emergency-lighting">
            <span class="tile-icon">&#128161;</span>
            <span>
              <b>Emergency lighting test</b>
              <small>Monthly and annual emergency-light checks</small>
            </span>
            <i>&rsaquo;</i>
          </button>                  <button class="form-tile" data-start="water-temperature-checks">
            <span class="tile-icon">&#128688;</span>
            <span>
              <b>Water temperature checks</b>
              <small>Legionella hot, cold and TMV checks</small>
            </span>
            <i>&rsaquo;</i>
          </button>
          <button class="form-tile" data-start="weekly-outlet-flushing">
            <span class="tile-icon">&#128703;</span>
            <span>
              <b>Weekly outlet flushing</b>
              <small>Flush and record low use outlets</small>
            </span>
            <i>&rsaquo;</i>
          </button>

          <button class="form-tile" data-start="sprinkler-valve-weekly-test">
            <span class="tile-icon">&#128658;</span>
            <span><b>Sprinkler valve weekly test</b><small>Valves, bell test, storage and heating</small></span>
            <i>&rsaquo;</i>
          </button>
        </div>
      </section>
      <section id="editorView" class="view" hidden>
        <div class="progress">
          <span id="formState">New inspection</span
          ><span id="rowCount">0 entries</span>
        </div>
        <form id="editor"></form>
      </section>
      <section id="recordsView" class="view" hidden>
        <div class="summary">
          <div>
            <small>TOTAL ON DEVICE</small><strong id="recordCount">0</strong>
          </div>
          <button id="exportAll">Back up all</button>
        </div>
        <div id="recordList"></div>
        <div class="import-row">
          <label
            >Import JSON backup<input
              id="importFile"
              type="file"
              accept="application/json"
              hidden /></label
          ><button id="csvAll">Export CSV</button>
        </div>
      </section>
    </main>
    <nav class="bottom-nav">
      <button class="active" data-nav="home"><span>⌂</span>Forms</button
      ><button data-nav="records"><span>▤</span>Records</button>
    </nav>
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-card">
        <div class="grab"></div>
        <h3 id="sheetTitle">Share inspection</h3>
        <p id="sheetText"></p>
        <button id="nativeShare">Open device share menu</button
        ><button id="closeSheet" class="text-btn">Cancel</button>
      </div>
    </div>
    <div
      id="appDialog"
      class="app-dialog"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="appDialogTitle"
      aria-describedby="appDialogMessage"
    >
      <div class="app-dialog-card">
        <div id="appDialogIcon" class="app-dialog-icon" aria-hidden="true">
          !
        </div>
        <h2 id="appDialogTitle">Nothing to back up</h2>
        <p id="appDialogMessage">Complete and save an inspection first.</p>
        <div class="app-dialog-actions">
          <button
            id="appDialogCancel"
            class="dialog-secondary"
            type="button"
            hidden
          >
            Keep record
          </button>
          <button
            id="appDialogConfirm"
            class="dialog-danger"
            type="button"
            hidden
          >
            Delete record
          </button>
          <button id="appDialogClose" type="button">Got it</button>
        </div>
      </div>
    </div>
    <div id="successOverlay" class="success-overlay" hidden>
      <div class="success-burst">
        <span class="success-ring"></span><span class="success-check">✓</span>
        <h2>Inspection saved</h2>
        <p id="successTime"></p>
      </div>
    </div>
    <div id="toast"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
